<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digit Classifier</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0f;
    --surface:   #12121a;
    --card:      #1a1a26;
    --border:    #2a2a3e;
    --accent:    #7c6af7;
    --accent2:   #f76a8a;
    --text:      #e8e6ff;
    --muted:     #6b6a8a;
    --success:   #6af7b0;
    --canvas-bg: #000008;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    overflow-x: hidden;
  }

  /* Grid noise texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }

  .container { position: relative; z-index: 1; width: 100%; max-width: 860px; }

  /* ── Header ── */
  header { text-align: center; margin-bottom: 3rem; }
  header .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 0.75rem;
  }
  header h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--muted); font-size: 0.95rem; margin-top: 0.75rem;
    font-family: 'Space Mono', monospace;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 0; margin-bottom: 1.5rem;
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; background: var(--surface);
  }
  .tab-btn {
    flex: 1; padding: 0.75rem 1rem;
    background: transparent; border: none; cursor: pointer;
    color: var(--muted); font-family: 'Space Mono', monospace;
    font-size: 0.8rem; letter-spacing: 0.05em; transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--card); color: var(--accent);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }

  /* ── Main Layout ── */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 620px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  /* ── Panel ── */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
  }
  .panel-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem; letter-spacing: 0.25em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 1rem;
  }

  /* ── Canvas Panel ── */
  #canvas-panel { display: flex; flex-direction: column; align-items: center; }
  #draw-canvas {
    width: 280px; height: 280px;
    background: var(--canvas-bg);
    border-radius: 10px;
    cursor: crosshair;
    touch-action: none;
    border: 1px solid var(--border);
    display: block;
  }
  .canvas-controls {
    display: flex; gap: 0.75rem; margin-top: 1rem; width: 100%;
  }
  .btn {
    flex: 1; padding: 0.65rem 1rem;
    border-radius: 8px; border: 1px solid var(--border);
    font-family: 'Space Mono', monospace; font-size: 0.75rem;
    cursor: pointer; transition: all 0.2s; letter-spacing: 0.05em;
  }
  .btn-primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }

  /* Brush size */
  .brush-row {
    display: flex; align-items: center; gap: 0.75rem;
    margin-top: 0.75rem; width: 100%;
  }
  .brush-row label {
    font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--muted);
    white-space: nowrap;
  }
  input[type="range"] {
    flex: 1; accent-color: var(--accent); cursor: pointer;
  }
  #brush-val {
    font-family: 'Space Mono', monospace; font-size: 0.7rem;
    color: var(--accent); width: 20px; text-align: right;
  }

  /* ── Upload Panel ── */
  #upload-panel { display: none; flex-direction: column; align-items: center; }
  #upload-panel.visible { display: flex; }
  #canvas-panel.visible { display: flex; }

  .drop-zone {
    width: 280px; height: 280px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.2s;
    position: relative; overflow: hidden;
    background: var(--surface);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(124,106,247,0.07);
  }
  .drop-zone svg { opacity: 0.3; margin-bottom: 0.75rem; }
  .drop-zone p {
    font-family: 'Space Mono', monospace; font-size: 0.7rem;
    color: var(--muted); text-align: center; line-height: 1.6;
  }
  .drop-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  #preview-img {
    width: 280px; height: 280px; object-fit: contain;
    border-radius: 10px; display: none;
    border: 1px solid var(--border);
    background: var(--canvas-bg);
  }
  .upload-controls {
    display: flex; gap: 0.75rem; margin-top: 1rem; width: 280px;
  }

  /* ── Results Panel ── */
  .result-panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1rem;
  }

  .big-digit {
    font-size: 6rem; font-weight: 800; line-height: 1;
    color: var(--accent); text-align: center;
    font-family: 'Space Mono', monospace;
    min-height: 7rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .big-digit.empty { color: var(--border); font-size: 2rem; font-weight: 400; }

  .confidence-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .conf-label {
    font-family: 'Space Mono', monospace; font-size: 0.65rem;
    color: var(--muted); letter-spacing: 0.2em; text-transform: uppercase;
  }
  .conf-val {
    font-family: 'Space Mono', monospace; font-size: 0.85rem; color: var(--success);
  }
  .conf-bar-bg {
    height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .conf-bar {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--success));
    border-radius: 2px; width: 0%;
    transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
  }

  /* Per-digit probability bars */
  .prob-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem;
  }
  .prob-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .prob-bar-wrap {
    width: 100%; height: 40px;
    background: var(--surface); border-radius: 4px;
    display: flex; align-items: flex-end; overflow: hidden;
    border: 1px solid var(--border);
  }
  .prob-bar-fill {
    width: 100%; background: var(--accent);
    border-radius: 3px;
    transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    height: 0%;
    opacity: 0.7;
  }
  .prob-bar-fill.top { opacity: 1; background: linear-gradient(180deg, var(--accent2), var(--accent)); }
  .prob-digit {
    font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--muted);
  }
  .prob-pct {
    font-family: 'Space Mono', monospace; font-size: 0.55rem; color: var(--muted);
  }

  /* Status / loading */
  .status {
    font-family: 'Space Mono', monospace; font-size: 0.7rem;
    color: var(--muted); text-align: center; min-height: 1rem;
  }
  .status.error { color: var(--accent2); }
  .status.loading { color: var(--accent); }

  /* ── API URL config ── */
  .api-row {
    display: flex; gap: 0.5rem; margin-bottom: 1.5rem; align-items: center;
  }
  .api-row label {
    font-family: 'Space Mono', monospace; font-size: 0.65rem;
    color: var(--muted); white-space: nowrap;
  }
  .api-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text); padding: 0.5rem 0.75rem;
    font-family: 'Space Mono', monospace; font-size: 0.75rem;
    outline: none; transition: border-color 0.2s;
  }
  .api-input:focus { border-color: var(--accent); }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header>
    <div class="eyebrow">CNN · TensorFlow/Keras · MNIST</div>
    <h1>Digit Classifier</h1>
    <p>Handwritten digit recognition — draw or upload</p>
  </header>

  <!-- API URL -->
  <div class="api-row">
    <label>API →</label>
    <input id="api-url" class="api-input" type="text" value="http://localhost:5000/predict" placeholder="http://localhost:5000/predict"/>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="draw">✏️ Draw Digit</button>
    <button class="tab-btn" data-tab="upload">📁 Upload Image</button>
  </div>

  <!-- Main grid -->
  <div class="main-grid">

    <!-- ── Draw Panel ── -->
    <div class="panel" id="canvas-panel">
      <div class="panel-label">Draw a digit (0–9)</div>
      <canvas id="draw-canvas" width="280" height="280"></canvas>
      <div class="brush-row">
        <label>Brush</label>
        <input type="range" id="brush-size" min="8" max="40" value="22"/>
        <span id="brush-val">22</span>
      </div>
      <div class="canvas-controls">
        <button class="btn btn-primary" id="predict-canvas-btn">Predict</button>
        <button class="btn btn-ghost"   id="clear-btn">Clear</button>
      </div>
    </div>

    <!-- ── Upload Panel ── -->
    <div class="panel" id="upload-panel">
      <div class="panel-label">Upload digit image</div>
      <div class="drop-zone" id="drop-zone">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop image here<br/>or click to browse</p>
        <input type="file" id="file-input" accept="image/*"/>
      </div>
      <img id="preview-img" alt="preview"/>
      <div class="upload-controls">
        <button class="btn btn-primary" id="predict-upload-btn">Predict</button>
        <button class="btn btn-ghost"   id="reset-upload-btn">Reset</button>
      </div>
    </div>

    <!-- ── Results Panel ── -->
    <div class="result-panel" style="grid-column: 1 / -1;">
      <div class="panel-label">Prediction</div>

      <div style="display:flex; gap:2rem; align-items:center; flex-wrap:wrap;">
        <div class="big-digit empty" id="result-digit">?</div>

        <div style="flex:1; min-width:200px; display:flex; flex-direction:column; gap:0.75rem;">
          <div class="confidence-row">
            <span class="conf-label">Confidence</span>
            <span class="conf-val" id="conf-val">—</span>
          </div>
          <div class="conf-bar-bg"><div class="conf-bar" id="conf-bar"></div></div>
        </div>
      </div>

      <!-- Per-digit bars -->
      <div class="panel-label" style="margin-bottom:0;">All probabilities</div>
      <div class="prob-grid" id="prob-grid">
        <!-- filled by JS -->
      </div>

      <div class="status" id="status">Draw a digit and press Predict</div>
    </div>

  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let uploadedFile = null;
let activeTab = 'draw';

// ─── Tabs ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    document.getElementById('canvas-panel').style.display = activeTab === 'draw'   ? 'flex' : 'none';
    document.getElementById('upload-panel').style.display = activeTab === 'upload' ? 'flex' : 'none';
  });
});
// Init visibility
document.getElementById('upload-panel').style.display = 'none';

// ─── Canvas Drawing ───────────────────────────────────────────────────────────
const canvas  = document.getElementById('draw-canvas');
const ctx     = canvas.getContext('2d');
let isDrawing = false;

ctx.fillStyle = '#000008';
ctx.fillRect(0, 0, 280, 280);

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return {
      x: (e.touches[0].clientX - rect.left) * scaleX,
      y: (e.touches[0].clientY - rect.top)  * scaleY,
    };
  }
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

canvas.addEventListener('mousedown',  e => { isDrawing = true; draw(e); });
canvas.addEventListener('mousemove',  e => { if (isDrawing) draw(e); });
canvas.addEventListener('mouseup',    () => { isDrawing = false; ctx.beginPath(); });
canvas.addEventListener('mouseleave', () => { isDrawing = false; ctx.beginPath(); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; draw(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); if (isDrawing) draw(e); }, { passive: false });
canvas.addEventListener('touchend',   () => { isDrawing = false; ctx.beginPath(); });

function draw(e) {
  const { x, y } = getPos(e);
  const size = parseInt(document.getElementById('brush-size').value);
  ctx.lineWidth   = size;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.strokeStyle = '#ffffff';
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
}

document.getElementById('brush-size').addEventListener('input', e => {
  document.getElementById('brush-val').textContent = e.target.value;
});

document.getElementById('clear-btn').addEventListener('click', () => {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, 280, 280);
  ctx.beginPath();
  resetResults();
});

// ─── Upload ───────────────────────────────────────────────────────────────────
const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const previewImg = document.getElementById('preview-img');

function showPreview(file) {
  uploadedFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  previewImg.style.display = 'block';
  dropZone.style.display   = 'none';
}

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) showPreview(e.target.files[0]);
});

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) showPreview(e.dataTransfer.files[0]);
});

document.getElementById('reset-upload-btn').addEventListener('click', () => {
  uploadedFile = null;
  previewImg.style.display = 'none';
  previewImg.src = '';
  dropZone.style.display = 'flex';
  fileInput.value = '';
  resetResults();
});

// ─── Prob Grid init ───────────────────────────────────────────────────────────
const probGrid = document.getElementById('prob-grid');
for (let i = 0; i < 10; i++) {
  probGrid.innerHTML += `
    <div class="prob-item" id="prob-${i}">
      <div class="prob-bar-wrap">
        <div class="prob-bar-fill" id="bar-${i}" style="height:0%"></div>
      </div>
      <span class="prob-digit">${i}</span>
      <span class="prob-pct" id="pct-${i}">0%</span>
    </div>`;
}

// ─── Results ──────────────────────────────────────────────────────────────────
function resetResults() {
  document.getElementById('result-digit').textContent = '?';
  document.getElementById('result-digit').classList.add('empty');
  document.getElementById('conf-val').textContent = '—';
  document.getElementById('conf-bar').style.width = '0%';
  document.getElementById('status').textContent = 'Draw a digit and press Predict';
  document.getElementById('status').className = 'status';
  for (let i = 0; i < 10; i++) {
    document.getElementById(`bar-${i}`).style.height = '0%';
    document.getElementById(`bar-${i}`).classList.remove('top');
    document.getElementById(`pct-${i}`).textContent = '0%';
  }
}

function showResults(data) {
  const digitEl = document.getElementById('result-digit');
  digitEl.textContent = data.digit;
  digitEl.classList.remove('empty');

  const pct = Math.round(data.confidence * 100);
  document.getElementById('conf-val').textContent = `${pct}%`;
  document.getElementById('conf-bar').style.width = `${pct}%`;

  data.probabilities.forEach((p, i) => {
    const h = Math.round(p * 100);
    const bar = document.getElementById(`bar-${i}`);
    bar.style.height = `${h}%`;
    bar.classList.toggle('top', i === data.digit);
    document.getElementById(`pct-${i}`).textContent = `${h}%`;
  });

  document.getElementById('status').textContent =
    `Predicted: ${data.digit}  (${pct}% confident)`;
  document.getElementById('status').className = 'status';
}

// ─── API Call ─────────────────────────────────────────────────────────────────
async function sendToAPI(base64) {
  const apiUrl = document.getElementById('api-url').value.trim();
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Sending to model…';
  statusEl.className = 'status loading';

  try {
    const resp = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64 }),
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    showResults(data);
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
    statusEl.className = 'status error';
  }
}

// ─── Predict from Canvas ──────────────────────────────────────────────────────
document.getElementById('predict-canvas-btn').addEventListener('click', () => {
  const base64 = canvas.toDataURL('image/png');
  sendToAPI(base64);
});

// ─── Predict from Upload ──────────────────────────────────────────────────────
document.getElementById('predict-upload-btn').addEventListener('click', () => {
  if (!uploadedFile) {
    document.getElementById('status').textContent = 'Please upload an image first.';
    document.getElementById('status').className = 'status error';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => sendToAPI(e.target.result);
  reader.readAsDataURL(uploadedFile);
});
</script>
</body>
</html>
